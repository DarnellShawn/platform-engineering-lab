apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-prod
  namespace: podinfo-helm-prod
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
      version: "*"
  values:
    service:
      type: LoadBalancer
      httpPort: 12001
      grpcPort: null